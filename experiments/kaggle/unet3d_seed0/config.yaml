  split_file: data/splits/split_seed42_full.json
  split_key: subset
  stats_file: data/processed_full/intensity_stats.json
model:
  type: unet3d
  num_classes: 3
  channels:
  - 16
  - 32
  - 64
  - 128
  strides:
  - - 1
    - 2
    - 2
  - - 2
    - 2
    - 2
  - - 2
    - 2
    - 2
